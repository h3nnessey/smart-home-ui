@if (isAuthed()) {
  @let hidden = !isOpen();

  <aside [class.hidden]="hidden" class="sidebar">
    <app-sidebar-header title="Smart Home UI" [hidden]="hidden" />
    <button
      class="btn"
      appearance="secondary"
      iconStart="{{ icon | tuiMaterialIcon }}"
      size="m"
      tuiIconButton
      [title]="!hidden ? 'Close sidebar' : 'Open sidebar'"
      type="button"
      (click)="toggleSidebar()"
    ></button>
    <app-sidebar-menu [items]="items" [hidden]="hidden" />
    <app-sidebar-footer
      [initials]="user().initials"
      [username]="user().fullName"
      (logoutClick)="handleLogout()"
      [hidden]="hidden"
    />
  </aside>
}
