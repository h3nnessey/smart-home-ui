<aside [class.hidden]="!isOpen()" class="sidebar">
  <!-- header -->
  <header class="header" tuiHeader="h4">
    <hgroup class="title" tuiTitle>
      <h1>Smart Home UI</h1>
    </hgroup>
    @if (isMobile()) {
      <button
        class="btn"
        appearance="outline"
        [iconStart]="buttonIcon"
        size="m"
        tuiIconButton
        type="button"
        [style.border-radius.%]="100"
        (click)="toggleSidebar()"
      ></button>
    }
  </header>
  <!-- header -->

  <!-- menu -->
  <nav class="nav">
    <ul>
      <li>
        <!-- active -->
        <button appearance="outline" tuiButton type="button">
          <tui-avatar
            class="icon"
            size="m"
            src="@tui.material.filled.dashboard"
          />
          Overview
        </button>
      </li>
      <li>
        <button appearance="action-grayscale" tuiButton type="button" disabled>
          <tui-avatar size="m" src="@tui.material.filled.info" />
          About
        </button>
      </li>
    </ul>
  </nav>
  <!-- menu -->

  <!-- footer -->
  <footer class="footer">
    <tui-avatar size="l" src="RS" [style.background]="'RS' | tuiAutoColor" />
    <h3 class="subtitle">RSSchool. Angular.</h3>
  </footer>
  <!-- footer -->
</aside>
