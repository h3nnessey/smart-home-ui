@let data = device();

<label class="label" tuiCell [appHighlightElement]="data.state">
  <tui-icon
    class="icon"
    [icon]="data.icon | tuiMaterialIcon"
    [class.active]="data.state"
    size="l"
  />
  <div class="title" tuiTitle>{{ data.label }}</div>
  <input
    [class.hidden]="layout() === 'singleDevice'"
    class="input"
    tuiSwitch
    type="checkbox"
    [showIcons]="false"
    [ngModel]="data.state"
    (ngModelChange)="changeState($event)"
  />
</label>
